{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite" aria-atomic="true">
  {% for message in messages %}
  <div class="toast {% if message.tags == 'error' %}bg-danger-lt{% else %}bg-info-lt{% endif %}" role="status" aria-atomic="true" data-bs-delay="4000" style="--tblr-toast-color: #000;">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
